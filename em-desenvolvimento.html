<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frethe. — Página em desenvolvimento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,100;1,400;1,500;1,600;1,800;1,900&family=Poppins:ital,wght@0,200;0,300;0,900;1,400;1,900&display=swap" rel="stylesheet">
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
        }
        body{
            color: black;
            overflow-x: hidden;
        }
        .dev-hero{
            min-height: 100vh;
            padding: 60px 8%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #FFFDFB;
        }
        .dev-icon{
            width: 84px;
            height: 84px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 2px solid #EDEAE4;
            border-radius: 50%;
            margin-bottom: 24px;
            animation: dev-float 3s ease-in-out infinite;
        }
        .dev-icon svg{
            width: 38px;
            height: 38px;
        }
        @keyframes dev-float{
            0%, 100%{ transform: translateY(0); }
            50%{ transform: translateY(-8px); }
        }
        .eyebrow-center{
            display: block;
            text-align: center;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgb(255,99,11);
            margin-bottom: 8px;
        }
        .dev-title{
            font-size: 40px;
            font-weight: 800;
            line-height: 1.25;
            color: black;
            max-width: 720px;
            margin-bottom: 18px;
        }
        .dev-title span{
            color: rgb(255,99,11);
        }
        .dev-text{
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.7;
            color: #666;
            max-width: 520px;
            margin-bottom: 40px;
        }
        .dev-progress{
            width: 100%;
            max-width: 320px;
            height: 8px;
            background: #EDEAE4;
            border-radius: 3rem;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .dev-progress-bar{
            width: 65%;
            height: 100%;
            background: rgb(255,99,11);
            border-radius: 3rem;
            animation: dev-fill 2.2s ease-in-out infinite alternate;
        }
        @keyframes dev-fill{
            from{ width: 45%; }
            to{ width: 70%; }
        }
        .dev-progress-label{
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #999;
        }

        @media (max-width: 500px){
            .dev-title{ font-size: 28px; }
            .dev-icon{ width: 68px; height: 68px; }
            .dev-icon svg{ width: 30px; height: 30px; }
        }
    </style>
</head>
<body>

    <section class="dev-hero">
        <div class="dev-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2 3 6.5V12c0 5.6 3.8 9.7 9 11 5.2-1.3 9-5.4 9-11V6.5L12 2Z" stroke="rgb(255,99,11)" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M9 12.2 11.2 14.5 15.5 9.8" stroke="rgb(255,99,11)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <span class="eyebrow-center">Em construção</span>
        <h1 class="dev-title">Esta página ainda está <span>em desenvolvimento</span></h1>
        <p class="dev-text">Estamos trabalhando para trazer essa novidade para o Frethe. em breve. Volte mais tarde para conferir.</p>

        <div class="dev-progress">
            <div class="dev-progress-bar"></div>
        </div>
        <span class="dev-progress-label">Em andamento</span>
    </section>

</body>
</html>
